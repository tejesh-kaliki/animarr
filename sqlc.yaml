version: "2"
sql:
  - engine: sqlite
    queries: sql/queries
    schema: sql/schema
    gen:
      go:
        package: db
        out: internal/store/db
        emit_interface: false
        emit_json_tags: false
        emit_pointers_for_null_types: true
        emit_sql_as_comment: true
        overrides:
          - column: shows.monitored
            go_type:
              type: Bool
          - column: shows.next_airing_at
            go_type:
              type: NullUnixTime
          - column: shows.created_at
            go_type:
              type: UnixTime
          - column: shows.updated_at
            go_type:
              type: UnixTime
          - column: episodes.air_date
            go_type:
              type: NullUnixTime
          - column: episodes.downloaded_at
            go_type:
              type: NullUnixTime
          - column: episodes.last_search_at
            go_type:
              type: NullUnixTime
          - column: downloads.added_at
            go_type:
              type: UnixTime
          - column: history.at
            go_type:
              type: UnixTime
          - column: settings.is_secret
            go_type:
              type: Bool
          - column: settings.updated_at
            go_type:
              type: UnixTime
          - column: encodes.lease_until
            go_type:
              type: NullUnixTime
          - column: encodes.started_at
            go_type:
              type: NullUnixTime
          - column: encodes.created_at
            go_type:
              type: UnixTime
          - column: encodes.updated_at
            go_type:
              type: UnixTime
